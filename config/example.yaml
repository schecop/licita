# Model per role (rule 7). PLACEHOLDERS until docs/model-research.md and the D4 comparison:
# the choice is made with evals and recorded in an ADR `model-choice`, never here by habit.
# Copy to config/local.yaml (gitignored) to override.
llm:
  screening:     # cheap; may end up as no LLM at all (CPV + keywords)
    provider: anthropic
    model: claude-haiku-5-5
    usd_per_mtok_in: "0.10"
    usd_per_mtok_out: "0.50"
  extraction:    # structured output over long tender documents; prompt caching
    provider: anthropic
    model: claude-haiku-5-5
    usd_per_mtok_in: "0.10"
    usd_per_mtok_out: "0.50"
  decision:      # go/no-go with a confidence, only for what the rules did not settle
    provider: anthropic
    model: claude-haiku-5-5
    usd_per_mtok_in: "0.10"
    usd_per_mtok_out: "0.50"
  coach:         # edits the extraction prompt from eval failures (2nd pass of the coach)
    provider: anthropic
    model: claude-sonnet-5-5
    usd_per_mtok_in: "2"
    usd_per_mtok_out: "10"

placsp:
  feed_url: https://contrataciondelestado.es/sindicacion/sindicacion_643/licitacionesPerfilesContratanteCompleto3.atom
  cache_dir: data/raw/atom      # every page cached; never downloaded twice
  db_path: data/licita.db
  throttle_seconds: 2           # between requests to PLACSP (minimum 1)
  max_pages: 20                 # a page is ~500 entries (~15 MB); a weekday is ~7 pages

rules:
  profile_path: data/company/profile.yaml
  min_days_to_deadline: 5       # fewer days left than this: no time to prepare a bid
